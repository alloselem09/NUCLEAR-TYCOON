<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101923" />
    <meta name="description" content="NUCLEAR TYCOON — construis ton empire énergétique." />
    <title>NUCLEAR TYCOON</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Bibliothèques externes : aucune installation locale nécessaire. -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

    <!-- On attend explicitement le chargement des bibliothèques et la compilation du TSX. -->
    <script>
      (async function () {
        const root = document.getElementById("root");
        const showError = (message) => {
          root.innerHTML = '<div style="padding:24px;color:#fff;font-family:Arial;line-height:1.5">' + message + '</div>';
        };

        if (!window.THREE || !window.React || !window.ReactDOM || !window.Babel) {
          showError("Impossible de charger une bibliothèque externe (Three.js, React ou Babel). Vérifie ta connexion Internet et actualise la page.");
          return;
        }

        try {
          const response = await fetch("./src/Game.tsx");
          if (!response.ok) throw new Error("Game.tsx introuvable (" + response.status + ").");
          const source = await response.text();
          const compiled = Babel.transform(source, {
            filename: "Game.tsx",
            presets: ["typescript", "react"]
          }).code;

          const script = document.createElement("script");
          script.textContent = compiled;
          document.body.appendChild(script);

          if (!window.Game) throw new Error("Le composant du jeu n'a pas été chargé.");
          ReactDOM.createRoot(root).render(React.createElement(window.Game));
        } catch (error) {
          console.error("NUCLEAR TYCOON — erreur de démarrage :", error);
          showError("Le jeu n'a pas pu démarrer : " + (error && error.message ? error.message : error) + ". Ouvre la console du navigateur (F12) pour voir le détail.");
        }
      })();
    </script>
  </body>
</html>
